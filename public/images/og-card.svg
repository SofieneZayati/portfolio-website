<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sofiene Zayati — Full-Stack and AI Engineer</title>
  <desc id="desc">Engineering ideas into real products. Web products, applied AI, and connected systems.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#6435b2" stop-opacity=".42"/><stop offset="1" stop-color="#08080d" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent"><stop stop-color="#e1d2ff"/><stop offset=".6" stop-color="#b595ff"/><stop offset="1" stop-color="#8caaff"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#21133c"/><stop offset="1" stop-color="#0d0a15"/></linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#b79aff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#08080d"/>
  <ellipse cx="970" cy="285" rx="560" ry="470" fill="url(#glow)"/>
  <rect x="600" width="600" height="630" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="57" width="48" height="48" rx="12" fill="#1b112d" stroke="#b79aff" stroke-opacity=".35"/>
    <text x="93" y="89" text-anchor="middle" fill="#b79aff" font-size="22" font-weight="bold" letter-spacing="-2">SZ</text>
    <text x="136" y="77" fill="#f5f3ff" font-size="20">Sofiene Zayati</text>
    <text x="136" y="101" fill="#aaa4bd" font-size="13">Full-Stack &amp; AI Engineer</text>
    <path d="M70 140H1130" stroke="#b79aff" stroke-opacity=".15"/>
    <text x="70" y="252" fill="#f5f3ff" font-size="78" font-weight="bold" letter-spacing="-4">Engineering</text>
    <text x="70" y="338" fill="#f5f3ff" font-size="78" font-weight="bold" letter-spacing="-4">ideas into</text>
    <text x="70" y="424" fill="url(#accent)" font-size="78" font-weight="bold" letter-spacing="-4">real products.</text>
    <text x="72" y="484" fill="#aaa4bd" font-size="18">Web products / Applied AI / Connected systems</text>
    <rect x="815" y="190" width="315" height="315" rx="24" fill="url(#panel)" stroke="#b79aff" stroke-opacity=".24"/>
    <circle cx="972" cy="347" r="121" fill="none" stroke="#b79aff" stroke-opacity=".2"/>
    <circle cx="972" cy="347" r="95" fill="none" stroke="#8caaff" stroke-opacity=".3"/>
    <text x="964" y="383" text-anchor="middle" fill="url(#accent)" font-size="100" font-weight="bold" letter-spacing="-9">SZ</text>
    <text x="972" y="475" text-anchor="middle" fill="#aaa4bd" font-size="12" letter-spacing="3">DESIGN → CODE → SHIP</text>
    <path d="M70 536H1130" stroke="#b79aff" stroke-opacity=".15"/>
    <text x="72" y="582" fill="#aaa4bd" font-size="15">Based in Tunisia. Building end to end.</text>
    <text x="1130" y="582" text-anchor="end" fill="#b79aff" font-size="16">sofienezayati.tn</text>
