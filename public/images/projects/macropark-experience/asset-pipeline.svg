<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
<title id="title">MacroPark — detail with a deliberate asset budget</title><desc id="description">An attributed Khronos concept car and CC0 texture maps are optimized with Draco and WebP, fitted to the story envelope, and combined with custom architecture. Shared geometry, local reflections, and adaptive quality limit runtime work.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ae8ff0"/></marker></defs>
<rect width="1200" height="760" rx="22" fill="#0e0b18"/>
<g font-family="Inter, Arial, sans-serif"><text x="40" y="56" fill="#c3a6ff" font-size="13" font-weight="600">MACROPARK / 3D ASSET PIPELINE</text>
<text x="40" y="104" fill="#faf7ff" font-size="32" font-weight="600">Keep the character. Control the cost.</text>
<text x="40" y="143" fill="#b5afc7" font-size="18" font-weight="400">Detailed assets become a reusable part of the product, with clear attribution.</text>
<text x="40" y="201" fill="#c3a6ff" font-size="13" font-weight="600">01 / SOURCES</text><text x="440" y="201" fill="#c3a6ff" font-size="13" font-weight="600">02 / PREPARE</text><text x="840" y="201" fill="#c3a6ff" font-size="13" font-weight="600">03 / COMPOSE &amp; ADAPT</text>
<rect x="40" y="225" width="320" height="172" rx="16" fill="#171226" stroke="#3a2c53"/><rect x="40" y="421" width="320" height="174" rx="16" fill="#171226" stroke="#3a2c53"/>
<text x="64" y="269" fill="#faf7ff" font-size="23" font-weight="600">Khronos Car Concept</text>
<text x="64" y="307" fill="#b5afc7" font-size="17" font-weight="400">Eric Chadwick / DGG</text><text x="64" y="335" fill="#b5afc7" font-size="17" font-weight="400">CC BY 4.0 · source GLB</text><text x="64" y="363" fill="#b5afc7" font-size="17" font-weight="400">Body, cabin, four wheel pivots</text>
<text x="64" y="465" fill="#faf7ff" font-size="23" font-weight="600">Poly Haven surfaces</text>
<text x="64" y="503" fill="#b5afc7" font-size="17" font-weight="400">CC0 material maps</text><text x="64" y="531" fill="#b5afc7" font-size="17" font-weight="400">Color / normal / roughness</text><text x="64" y="559" fill="#b5afc7" font-size="17" font-weight="400">Concrete, timber, asphalt</text>
<rect x="440" y="225" width="320" height="370" rx="16" fill="#211832" stroke="#3a2c53"/>
<text x="464" y="267" fill="#c3a6ff" font-size="13" font-weight="600">A / SHRINK TRANSFER</text><text x="464" y="301" fill="#faf7ff" font-size="23" font-weight="600">Draco + WebP</text>
<text x="464" y="333" fill="#b5afc7" font-size="17" font-weight="400">Compress mesh and textures.</text>
<path d="M 464 356 H 736" stroke="#49345d"/>
<text x="464" y="388" fill="#c3a6ff" font-size="13" font-weight="600">B / FIT THE STORY</text><text x="464" y="422" fill="#faf7ff" font-size="23" font-weight="600">Normalize + batch</text>
<text x="464" y="458" fill="#b5afc7" font-size="17" font-weight="400">Ground and center the model.</text><text x="464" y="486" fill="#b5afc7" font-size="17" font-weight="400">Match heading and scale.</text><text x="464" y="514" fill="#b5afc7" font-size="17" font-weight="400">Share static geometry.</text><text x="464" y="542" fill="#b5afc7" font-size="17" font-weight="400">Keep four rolling wheel pivots.</text>
<rect x="840" y="225" width="320" height="370" rx="16" fill="#171226" stroke="#3a2c53"/>
<text x="864" y="269" fill="#faf7ff" font-size="23" font-weight="600">Custom architecture</text>
<text x="864" y="307" fill="#b5afc7" font-size="17" font-weight="400">Villa / residence / retail</text><text x="864" y="335" fill="#b5afc7" font-size="17" font-weight="400">Glazing, fins, interiors, planting</text>
<path d="M 864 356 H 1136" stroke="#49345d"/>
<text x="864" y="388" fill="#c3a6ff" font-size="13" font-weight="600">RUNTIME</text><text x="864" y="422" fill="#faf7ff" font-size="23" font-weight="600">Compose once, adapt</text>
<text x="864" y="458" fill="#b5afc7" font-size="16" font-weight="400">Local decoder and material maps</text><text x="864" y="486" fill="#b5afc7" font-size="16" font-weight="400">Generated reflection studio</text><text x="864" y="514" fill="#b5afc7" font-size="16" font-weight="400">Targeted shadows and adaptive DPR</text><text x="864" y="542" fill="#b5afc7" font-size="16" font-weight="400">Pause and reduced-motion support</text>
<path d="M 370 311 H 425" fill="none" stroke="#ae8ff0" stroke-width="2" marker-end="url(#arrow)"/><path d="M 370 508 H 425" fill="none" stroke="#ae8ff0" stroke-width="2" marker-end="url(#arrow)"/><path d="M 770 410 H 825" fill="none" stroke="#ae8ff0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 40 642 H 1160" stroke="#352745"/>
<text x="40" y="689" fill="#faf7ff" font-size="25" font-weight="600">11.8 MB → 1.01 MB</text><text x="40" y="724" fill="#b5afc7" font-size="16" font-weight="400">Source GLB → shipped vehicle</text>
<text x="475" y="689" fill="#faf7ff" font-size="25" font-weight="600">512 px</text><text x="475" y="724" fill="#b5afc7" font-size="16" font-weight="400">Locally served PBR maps</text>
<text x="840" y="689" fill="#faf7ff" font-size="25" font-weight="600">Shared + reusable</text><text x="840" y="724" fill="#b5afc7" font-size="16" font-weight="400">Prepared geometry, per-instance finishes</text></g></svg>
