<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
<title id="title">MacroPark — one plan, two experiences</title><desc id="description">The accessible workbench changes a validated Zustand plan. The deferred WebGL runtime visualizes it. Only parking choices are saved on the device; the same plan creates a brief with optional personal details held in memory.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ae8ff0"/></marker></defs>
<rect width="1200" height="760" rx="22" fill="#0e0b18"/>
<g font-family="Inter, Arial, sans-serif"><text x="40" y="56" fill="#c3a6ff" font-size="13" font-weight="600">MACROPARK / EXPERIENCE ARCHITECTURE</text>
<text x="40" y="104" fill="#faf7ff" font-size="32" font-weight="600">One plan. A clear interface. A responsive world.</text>
<text x="40" y="143" fill="#b5afc7" font-size="18" font-weight="400">Keep visitor decisions separate from how the scene renders them.</text>
<text x="40" y="201" fill="#c3a6ff" font-size="13" font-weight="600">01 / CHOOSE &amp; PREVIEW</text><text x="440" y="201" fill="#c3a6ff" font-size="13" font-weight="600">02 / VALIDATE &amp; RETAIN</text><text x="840" y="201" fill="#c3a6ff" font-size="13" font-weight="600">03 / MAKE IT VISIBLE</text>
<rect x="40" y="225" width="320" height="210" rx="16" fill="#171226" stroke="#3a2c53"/><rect x="440" y="225" width="320" height="210" rx="16" fill="#211832" stroke="#3a2c53"/><rect x="840" y="225" width="320" height="210" rx="16" fill="#171226" stroke="#3a2c53"/>
<text x="64" y="270" fill="#faf7ff" font-size="24" font-weight="600">Accessible workbench</text>
<text x="64" y="310" fill="#b5afc7" font-size="17" font-weight="400">Place and need selection</text><text x="64" y="338" fill="#b5afc7" font-size="17" font-weight="400">Preview / add / remove / replay</text><text x="64" y="366" fill="#b5afc7" font-size="17" font-weight="400">Keyboard and modal controls</text><text x="64" y="394" fill="#b5afc7" font-size="17" font-weight="400">Works without the 3D canvas</text>
<text x="464" y="270" fill="#faf7ff" font-size="24" font-weight="600">Validated plan</text>
<text x="464" y="310" fill="#b5afc7" font-size="17" font-weight="400">Zustand + domain rules</text><text x="464" y="338" fill="#b5afc7" font-size="17" font-weight="400">Independent plan per place</text><text x="464" y="366" fill="#b5afc7" font-size="17" font-weight="400">Solar depends on charging</text><text x="464" y="394" fill="#b5afc7" font-size="17" font-weight="400">Preview never silently adds</text>
<text x="864" y="270" fill="#faf7ff" font-size="24" font-weight="600">Deferred 3D runtime</text>
<text x="864" y="310" fill="#b5afc7" font-size="17" font-weight="400">React Three Fiber + Three.js</text><text x="864" y="338" fill="#b5afc7" font-size="17" font-weight="400">Vehicles and hardware stories</text><text x="864" y="366" fill="#b5afc7" font-size="17" font-weight="400">Guided camera or orbit mode</text><text x="864" y="394" fill="#b5afc7" font-size="17" font-weight="400">Adaptive quality and motion</text>
<path d="M 370 330 H 425" fill="none" stroke="#ae8ff0" stroke-width="2" marker-end="url(#arrow)"/><path d="M 770 330 H 825" fill="none" stroke="#ae8ff0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 445 V 477 H 305 V 500" fill="none" stroke="#ae8ff0" stroke-width="2" marker-end="url(#arrow)"/><path d="M 600 477 H 895 V 500" fill="none" stroke="#ae8ff0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="515" width="530" height="135" rx="16" fill="#171226" stroke="#3a2c53"/><rect x="630" y="515" width="530" height="135" rx="16" fill="#171226" stroke="#3a2c53"/>
<text x="64" y="545" fill="#c3a6ff" font-size="13" font-weight="600">DEVICE-LOCAL CHOICES</text><text x="64" y="577" fill="#faf7ff" font-size="22" font-weight="600">Return to the same parking plan</text>
<text x="64" y="612" fill="#b5afc7" font-size="17" font-weight="400">Validated options only; no contact details in storage.</text>
<text x="654" y="545" fill="#c3a6ff" font-size="13" font-weight="600">CONSISTENT PROJECT BRIEF</text><text x="654" y="577" fill="#faf7ff" font-size="22" font-weight="600">Preview, copy, or download</text>
<text x="654" y="612" fill="#b5afc7" font-size="17" font-weight="400">Optional personal fields stay in the current visit.</text>
<path d="M 40 684 H 1160" stroke="#352745"/>
<text x="40" y="719" fill="#c3a6ff" font-size="15" font-weight="600">Design rule</text><text x="168" y="719" fill="#f1eaff" font-size="18" font-weight="400">Exploration changes the preview. Only an explicit Add changes the plan.</text></g></svg>
